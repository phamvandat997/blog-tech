<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Tech — Chia sẻ kiến thức lập trình</title>
  <meta name="description" content="Blog Tech — kho tài liệu lập trình chuyên sâu: Java, Cấu trúc dữ liệu & Giải thuật, JavaScript. Lộ trình ôn luyện cho phỏng vấn kỹ thuật và chứng chỉ quốc tế.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Blog Tech — Chia sẻ kiến thức lập trình">
  <meta property="og:description" content="Blog Tech — kho tài liệu lập trình chuyên sâu: Java, Cấu trúc dữ liệu & Giải thuật, JavaScript. Lộ trình ôn luyện cho phỏng vấn kỹ thuật và chứng chỉ quốc tế.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script>
    try {
      var t = localStorage.getItem("blog.theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* bỏ qua */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <noscript>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  </noscript>
</head>

  <div id="root"></div>

</body>
</html>
