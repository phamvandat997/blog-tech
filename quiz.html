<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Quiz — Blog Tech</title>
  <meta name="description" content="Luyện tập câu hỏi trắc nghiệm kỹ thuật: Java, OOP, Cấu trúc dữ liệu & Giải thuật. Chấm điểm tự động và giải thích chi tiết từng câu.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    try {
      var t = localStorage.getItem("blog.theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* giữ nguyên data-theme */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body>
<div class="app-container min-h-screen flex flex-col transition-colors duration-200">

  <header class="navbar sticky top-0 z-40 w-full backdrop-blur-md bg-white/90 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="navbar-inner w-full lg:w-[60%] lg:max-w-[60%] mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      <a href="index.html" class="brand flex items-center gap-3 no-underline group">
        <div class="brand-logo">
          <img src="assets/images/logo.svg" alt="Blog Tech Logo" class="brand-logo-img">
        </div>
        <div class="brand-text">
          <div class="brand-title flex items-center text-base font-black tracking-tight leading-tight m-0">
            <span class="text-indigo-600 dark:text-indigo-400">Blog</span>
            <span class="text-slate-900 dark:text-white ml-1">Tech</span>
          </div>
          <p class="text-xs text-slate-500 dark:text-slate-400 font-medium m-0 hidden lg:block">Ghi chép &amp; chia sẻ kiến thức lập trình</p>
        </div>
      </a>

      <!-- Ô tìm kiếm nằm ngay trên nav, chỉ hiện ở màn hình danh sách bài quiz -->
      <div class="nav-quiz-search relative flex-1 min-w-0 max-w-sm hidden" id="nav-quiz-search">
        <input type="search" id="quiz-search-input"
               placeholder="Tìm bài trắc nghiệm…"
               aria-label="Tìm bài trắc nghiệm"
               class="w-full pl-9 pr-3 py-2 rounded-xl text-sm bg-slate-50 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none" aria-hidden="true">🔍</span>
      </div>

      <div class="nav-actions flex items-center gap-2.5">
        <a href="index.html" class="hidden sm:inline-flex px-3 py-1.5 rounded-xl font-semibold text-xs sm:text-sm text-slate-600 dark:text-slate-300 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors no-underline">
          Trang chủ
        </a>
        <a href="quiz.html" class="nav-quiz-btn flex items-center gap-1.5 px-3 py-1.5 rounded-xl font-bold text-xs sm:text-sm text-white bg-indigo-600 hover:bg-indigo-700 transition-all no-underline shadow-sm" title="Đang ở trang trắc nghiệm">
          <span>🎯</span>
          <span>Luyện Quiz</span>
        </a>
        <button class="btn-icon p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all cursor-pointer" data-theme-toggle title="Chuyển giao diện sáng / tối">🌙</button>
      </div>
    </div>
  </header>

  <main class="quiz-wrapper w-full lg:w-[60%] lg:max-w-[60%] mx-auto px-4 sm:px-6 py-6 sm:py-10 flex-1">
    <div id="quiz-root"></div>
  </main>

  <footer class="site-footer border-t border-slate-200 dark:border-slate-800/80 py-8 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md mt-auto">
    <div class="footer-inner w-full lg:w-[60%] lg:max-w-[60%] mx-auto px-4 text-center">
      <p class="footer-copyright text-sm text-slate-500 dark:text-slate-400">
        &copy; 2026 <strong class="font-bold text-slate-800 dark:text-slate-200">Blog Tech</strong>. All rights reserved.
      </p>
    </div>
  </footer>

</div>

<button class="btn-back-to-top" id="btn-back-to-top" title="Lên đầu trang" aria-label="Lên đầu trang">
  <svg class="progress-ring" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
    <circle class="progress-ring-track" cx="23" cy="23" r="20" fill="none" stroke-width="3"></circle>
    <circle class="progress-ring-indicator" cx="23" cy="23" r="20" fill="none" stroke-width="3" stroke-dasharray="125.66" stroke-dashoffset="125.66"></circle>
  </svg>
  <span class="back-to-top-icon" aria-hidden="true">↑</span>
</button>

<script src="generated/catalog.js"></script>
<script src="assets/js/dom.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/quiz.js"></script>
<script src="assets/js/quiz-page.js"></script>
</body>
</html>
