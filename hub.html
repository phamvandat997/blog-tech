<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh mục bài viết | Blog kỹ thuật</title>
  <meta name="description" content="Danh mục bài viết theo mảng nội dung và chuyên mục — lọc nhanh theo từ khoá, phase và tiến độ đọc.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Danh mục bài viết | Blog kỹ thuật">
  <meta property="og:description" content="Danh mục bài viết theo mảng nội dung và chuyên mục — lọc nhanh theo từ khoá, phase và tiến độ đọc.">
  <meta name="twitter:card" content="summary_large_image">
  <script>
    // Đặt giao diện TRƯỚC khi vẽ khung đầu tiên, nếu không trang chớp sáng rồi
    // mới lật sang tối. Buộc phải inline và đồng bộ; state.js chạy sau là muộn.
    // Cùng quy tắc với preferredTheme() trong assets/js/state.js.
    try {
      var t = localStorage.getItem("blog.theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* bỏ qua, giữ nguyên data-theme trong HTML */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Webfont không được chặn vẽ khung đầu tiên: nạp như stylesheet in ấn rồi
       đổi sang `all` khi tải xong. Chữ hiện ngay bằng font hệ thống. -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body>
<div class="app-container" id="hub-root">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">
        <div class="brand-logo">📘</div>
        <div class="brand-text">
          <h1 id="hub-title">Đang tải…</h1>
        </div>
      </a>


      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input"
               placeholder="Tìm bài viết…" autocomplete="off">
        <kbd class="search-kbd">⌘K</kbd>
        <button id="search-clear-btn" class="search-clear" type="button" title="Xoá tìm kiếm" hidden>✕</button>
      </div>

      <div class="nav-actions">
        <button class="btn-icon" data-theme-toggle title="Chuyển giao diện sáng / tối">🌙</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper">
    <aside class="sidebar">
      <div class="category-list" id="category-container"></div>
    </aside>

    <section class="content-area">
      <div class="hub-progress-tracker" id="hub-progress-tracker" hidden></div>
      <div class="hub-filter-bar" id="hub-filter-bar"></div>
      <div class="docs-container" id="docs-container"></div>
      <div class="pagination-wrapper" id="pagination-container"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copyright">
        &copy; 2026 <strong>Blog kỹ thuật</strong>. All rights reserved.
      </p>
    </div>
  </footer>

</div>

<button class="btn-back-to-top" id="btn-back-to-top" title="Lên đầu trang" aria-label="Lên đầu trang">▲</button>

<script src="generated/catalog.js"></script>
<script src="assets/js/dom.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/hub.js"></script>
</body>
</html>
