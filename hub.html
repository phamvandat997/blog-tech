<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danh mục bài viết | Blog Tech</title>
  <meta name="description" content="Danh mục bài viết theo mảng nội dung và chuyên mục — lọc nhanh theo từ khoá, phase và tiến độ đọc.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Danh mục bài viết | Blog Tech">
  <meta property="og:description" content="Danh mục bài viết theo mảng nội dung và chuyên mục — lọc nhanh theo từ khoá, phase và tiến độ đọc.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Đặt giao diện TRƯỚC khi vẽ khung đầu tiên, nếu không trang chớp sáng rồi
    // mới lật sang tối. Buộc phải inline và đồng bộ; state.js chạy sau là muộn.
    // Cùng quy tắc với preferredTheme() trong assets/js/state.js.
    try {
      var t = localStorage.getItem("blog.theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* bỏ qua, giữ nguyên data-theme trong HTML */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Webfont không được chặn vẽ khung đầu tiên: nạp như stylesheet in ấn rồi
       đổi sang `all` khi tải xong. Chữ hiện ngay bằng font hệ thống. -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body>
<div class="app-container min-h-screen flex flex-col transition-colors duration-200" id="hub-root">

  <header class="navbar sticky top-0 z-40 w-full backdrop-blur-md bg-white/90 dark:bg-slate-900/85 border-b border-slate-200 dark:border-slate-800 transition-colors">
    <div class="navbar-inner max-w-7xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-4">
      <a href="index.html" class="brand flex items-center gap-3 no-underline group">
        <div class="brand-logo">
          <img src="assets/images/logo.svg" alt="Blog Tech Logo" class="brand-logo-img">
        </div>
        <div class="brand-text">
          <div class="brand-title flex items-center text-base font-black tracking-tight leading-tight m-0">
            <span class="text-indigo-600 dark:text-indigo-400">Blog</span>
            <span class="text-slate-900 dark:text-white ml-1">Tech</span>
          </div>
        </div>
      </a>

      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" class="search-input"
               placeholder="Tìm bài viết…" autocomplete="off">
        <kbd class="search-kbd">⌘K</kbd>
        <button id="search-clear-btn" class="search-clear" type="button" title="Xoá tìm kiếm" hidden>✕</button>
      </div>

      <div class="nav-actions flex items-center gap-2">
        <button class="btn-icon p-2 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-600 dark:text-slate-300 transition-all cursor-pointer" data-theme-toggle title="Chuyển giao diện sáng / tối">🌙</button>
      </div>
    </div>
  </header>

  <main class="main-wrapper max-w-7xl mx-auto px-4 sm:px-6 py-8 w-full flex-1">
    <aside class="sidebar">
      <div class="category-list" id="category-container"></div>
    </aside>

    <section class="content-area">
      <header class="hub-header mb-6">
        <h1 id="hub-title" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white tracking-tight m-0">Đang tải…</h1>
        <p id="hub-tagline" class="text-sm text-slate-500 dark:text-slate-400 mt-1.5 m-0"></p>
      </header>
      <div class="hub-progress-tracker" id="hub-progress-tracker" hidden></div>
      <div class="hub-filter-bar" id="hub-filter-bar"></div>
      <div class="docs-container" id="docs-container"></div>
      <div class="pagination-wrapper" id="pagination-container"></div>
    </section>
  </main>

  <footer class="site-footer border-t border-slate-200 dark:border-slate-800/80 py-8 bg-white/70 dark:bg-slate-900/70 backdrop-blur-md mt-auto">
    <div class="footer-inner max-w-6xl mx-auto px-4 text-center">
      <p class="footer-copyright text-sm text-slate-500 dark:text-slate-400">
        &copy; 2026 <strong class="font-bold text-slate-800 dark:text-slate-200">Blog Tech</strong>. All rights reserved.
      </p>
    </div>
  </footer>

</div>

<button class="btn-back-to-top" id="btn-back-to-top" title="Lên đầu trang" aria-label="Lên đầu trang">
  <svg class="progress-ring" width="46" height="46" viewBox="0 0 46 46" aria-hidden="true">
    <circle class="progress-ring-track" cx="23" cy="23" r="20" fill="none" stroke-width="3"></circle>
    <circle class="progress-ring-indicator" cx="23" cy="23" r="20" fill="none" stroke-width="3" stroke-dasharray="125.66" stroke-dashoffset="125.66"></circle>
  </svg>
  <span class="back-to-top-icon" aria-hidden="true">↑</span>
</button>

<script src="generated/catalog.js"></script>
<script src="assets/js/dom.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/hub.js"></script>
</body>
</html>
