<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không tìm thấy trang | Blog Tech</title>
  <meta name="description" content="Không tìm thấy trang bạn cần.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Không tìm thấy trang | Blog Tech">
  <meta property="og:description" content="Không tìm thấy trang bạn cần.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Đặt giao diện TRƯỚC khi vẽ khung đầu tiên, nếu không trang chớp sáng rồi
    // mới lật sang tối. Buộc phải inline và đồng bộ; state.js chạy sau là muộn.
    // Cùng quy tắc với preferredTheme() trong assets/js/state.js.
    try {
      var t = localStorage.getItem("blog.theme");
      if (t !== "dark" && t !== "light") {
        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* bỏ qua, giữ nguyên data-theme trong HTML */ }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Webfont không được chặn vẽ khung đầu tiên: nạp như stylesheet in ấn rồi
       đổi sang `all` khi tải xong. Chữ hiện ngay bằng font hệ thống. -->
  <link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/css/tailwind.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body>
<div class="app-container">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="brand">
        <div class="brand-logo">
          <img src="assets/images/logo.svg" alt="Blog Tech Logo" class="brand-logo-img">
        </div>
        <div class="brand-text">
          <div class="brand-title flex items-center text-base font-black tracking-tight leading-tight m-0">
            <span class="text-indigo-600 dark:text-indigo-400">Blog</span>
            <span class="text-slate-900 dark:text-white ml-1">Tech</span>
          </div>
          <p>Ghi chép &amp; chia sẻ kiến thức lập trình</p>
        </div>
      </a>
      <div class="nav-actions">
        <button class="btn-icon" data-theme-toggle title="Chuyển giao diện sáng / tối">🌙</button>
      </div>
    </div>
  </header>

  <main class="landing-wrapper">
    <div class="empty-state">
      <div class="empty-icon">🧭</div>
      <h3>Không tìm thấy trang này</h3>
      <p>Đường dẫn có thể đã đổi, hoặc bài viết đã được chuyển sang chuyên mục khác.</p>
      <a class="btn-primary-link" href="index.html">⬅ Về trang chủ</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copyright">
        &copy; 2026 <strong>Blog Tech</strong>. All rights reserved.
      </p>
    </div>
  </footer>

</div>

<script src="assets/js/state.js"></script>
<script>document.addEventListener("DOMContentLoaded", initTheme);</script>
</body>
</html>
