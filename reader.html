<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang tải bài viết… | Blog kỹ thuật</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/blog.css">
</head>
<body>
<div class="reading-progress-bar" id="reading-progress" aria-hidden="true"></div>
<div class="app-container" id="reader-root">

  <header class="navbar">
    <div class="navbar-inner">
      <button class="btn-icon btn-toc-toggle" id="btn-toc-toggle" type="button"
              aria-label="Mở mục lục" aria-expanded="false" aria-controls="reader-toc" hidden>☰</button>

      <a href="index.html" class="brand">
        <div class="brand-logo">📘</div>
        <div class="brand-text">
          <h1>Blog kỹ thuật</h1>
        </div>
      </a>

      <div class="search-wrapper is-global">
        <span class="search-icon">🔍</span>
        <input type="text" id="reader-search" class="search-input"
               placeholder="Tìm bài viết…" autocomplete="off">
        <kbd class="search-kbd">⌘K</kbd>
        <div class="search-results" id="reader-search-results"></div>
      </div>

      <div class="nav-actions">
        <div class="font-size-controls" title="Điều chỉnh cỡ chữ đọc bài">
          <button class="font-btn" id="btn-font-dec" type="button" aria-label="Giảm cỡ chữ" title="Giảm cỡ chữ">A-</button>
          <span class="font-size-val" id="font-size-val">100%</span>
          <button class="font-btn" id="btn-font-inc" type="button" aria-label="Tăng cỡ chữ" title="Tăng cỡ chữ">A+</button>
        </div>
        <button class="btn-icon" id="btn-zen-mode" type="button" title="Chế độ đọc tập trung (Zen Mode) [Z]">🧘</button>
        <button class="btn-icon" data-theme-toggle title="Chuyển giao diện sáng / tối">🌙</button>
        <a class="viewer-nav-back" id="reader-back" href="index.html">⬅ Về danh mục</a>
      </div>
    </div>
  </header>

  <div class="reader-shell">
    <!-- Mục lục: cột trái ở desktop, ngăn kéo ở tablet/mobile -->
    <div class="toc-backdrop" id="toc-backdrop" hidden></div>
    <aside class="reader-toc" id="reader-toc" hidden aria-label="Mục lục bài viết">
      <div class="toc-head">
        <span class="toc-title" id="toc-title">Mục lục</span>
        <button class="btn-icon toc-close" id="btn-toc-close" type="button" aria-label="Đóng mục lục">✕</button>
      </div>
      <nav class="toc-nav" id="toc-nav"></nav>
    </aside>

    <main class="reader-layout">
      <nav class="reader-breadcrumb" id="reader-breadcrumb"></nav>

      <header class="reader-head">
        <h1 class="reader-title" id="reader-title">Đang tải…</h1>
        <p class="reader-date" id="reader-date"></p>
      </header>

      <article class="reader-content-card markdown-body" id="reader-body"></article>

      <div class="reader-complete-box" id="reader-complete-box" hidden>
        <div class="reader-complete-info">
          <div class="reader-complete-icon">🎓</div>
          <div class="reader-complete-text">
            <h3>Đánh dấu hoàn thành bài học</h3>
            <p>Lưu lại tiến độ để theo dõi trọn vẹn lộ trình ôn luyện của bạn.</p>
          </div>
        </div>
        <button class="btn-toggle-complete" id="btn-toggle-complete" type="button">
          <span class="complete-btn-icon">✓</span>
          <span class="complete-btn-label">Đánh dấu đã học</span>
        </button>
      </div>

      <!-- Khung thảo luận & bình luận Giscus (GitHub Discussions) -->
      <section class="reader-comments-section" id="reader-comments-section">
        <div class="comments-header">
          <div class="comments-title">
            <span class="comments-icon">💬</span>
            <h3>Bình luận &amp; Thảo luận</h3>
          </div>
          <span class="comments-badge">GitHub Discussions</span>
        </div>
        <div id="giscus-container" class="giscus-container"></div>
      </section>
    </main>

    <!-- Cột phải: Bài viết liên quan (Sidebar ở Desktop, tự hạ xuống dưới ở Tablet/Mobile) -->
    <aside class="reader-related-sidebar" id="reader-related-sidebar" hidden aria-label="Bài viết liên quan">
      <div class="related-sidebar-head">
        <span class="related-sidebar-badge">GỢI Ý ÔN TẬP</span>
        <h3 class="related-sidebar-title">📖 Bài viết liên quan</h3>
      </div>
      <div class="related-sidebar-list" id="reader-related-list"></div>
    </aside>
  </div>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="footer-copyright">
        &copy; 2026 <strong>Blog kỹ thuật</strong>. All rights reserved.
      </p>
    </div>
  </footer>

</div>

<button class="btn-back-to-top" id="btn-back-to-top" title="Lên đầu trang" aria-label="Lên đầu trang">▲</button>

<script src="generated/catalog.js"></script>
<script src="assets/js/dom.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/markdown.js"></script>
<script src="assets/js/reader.js"></script>
</body>
</html>
